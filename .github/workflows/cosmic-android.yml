name: Build COSMIC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout COSMIC
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify referenced frontend assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          print(f"Verified {len(refs)} linked frontend assets.")
          PY

      - name: Install backend test dependencies
        run: pip install -r requirements.txt

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify shared frontend and backend routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess, sys, time, urllib.request
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          env = os.environ.copy()
          env.update({"COSMIC_HOST":"127.0.0.1","COSMIC_PORT":"8765","COSMIC_DATABASE":"data/cosmic-ci.db","PYTHONUNBUFFERED":"1"})
          log = open("cosmic-ci-backend.log", "w+")
          server = subprocess.Popen([sys.executable, "-m", "backend.app"], env=env, stdout=log, stderr=subprocess.STDOUT)
          try:
              base = "http://127.0.0.1:8765"
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      if server.poll() is not None:
                          log.flush()
                          log.seek(0)
                          print(log.read())
                          raise SystemExit("COSMIC backend exited before becoming healthy.")
                      time.sleep(1)
              else:
                  log.flush()
                  log.seek(0)
                  print(log.read())
                  raise SystemExit("COSMIC backend did not start.")
              for route in ["/", "/css/cosmic-premium.css", "/js/avatar-studio.js", "/js/upgrade-ui.js", "/api/ai/models", "/api/avatar/3d/status"]:
                  with urllib.request.urlopen(base + route, timeout=10) as response:
                      if response.status != 200:
                          raise SystemExit(route + " returned HTTP " + str(response.status))
              print("Frontend assets and browser/backend routes passed.")
          finally:
              server.terminate()
              try: server.wait(timeout=10)
              except subprocess.TimeoutExpired: server.kill()
              log.close()
          PY

      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Copy latest COSMIC frontend
        run: |
          mkdir -p android-wrapper/www
          cp -a frontend/. android-wrapper/www/

      - name: Bundle Python backend source for Android
        run: |
          PYTHON_SRC="android-wrapper/android/app/src/main/python"
          mkdir -p "$PYTHON_SRC"
          rm -rf "$PYTHON_SRC/backend"
          cp -a backend "$PYTHON_SRC/backend"
          find "$PYTHON_SRC/backend" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$PYTHON_SRC/backend" -type f -name '*.pyc' -delete
          test -f "$PYTHON_SRC/backend/app.py"
          test -f "$PYTHON_SRC/backend/__init__.py"

      - name: Sync Capacitor Android project
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Build COSMIC APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload COSMIC APK
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-Android-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
