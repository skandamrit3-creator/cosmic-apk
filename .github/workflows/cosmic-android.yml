name: Build and Release COSMIC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout COSMIC
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --check frontend/js/brain-control.js
          node --check frontend/js/integrations.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify referenced frontend assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          print(f"Verified {len(refs)} linked frontend assets.")
          PY

      - name: Install backend test dependencies
        run: pip install -r requirements.txt

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify shared frontend and backend routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess, sys, time, urllib.request
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          env = os.environ.copy()
          env.update({"COSMIC_HOST":"127.0.0.1","COSMIC_PORT":"8765","COSMIC_DATABASE":"data/cosmic-ci.db","PYTHONUNBUFFERED":"1"})
          log = open("cosmic-ci-backend.log", "w+")
          server = subprocess.Popen([sys.executable, "-m", "backend.app"], env=env, stdout=log, stderr=subprocess.STDOUT)
          try:
              base = "http://127.0.0.1:8765"
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      if server.poll() is not None:
                          log.flush()
                          log.seek(0)
                          print(log.read())
                          raise SystemExit("COSMIC backend exited before becoming healthy.")
                      time.sleep(1)
              else:
                  log.flush()
                  log.seek(0)
                  print(log.read())
                  raise SystemExit("COSMIC backend did not start.")
              for route in ["/", "/css/cosmic-premium.css", "/js/avatar-studio.js", "/js/upgrade-ui.js", "/api/ai/models", "/api/ai/provider-keys", "/api/avatar/3d/status"]:
                  with urllib.request.urlopen(base + route, timeout=10) as response:
                      if response.status != 200:
                          raise SystemExit(route + " returned HTTP " + str(response.status))
              import json
              save_req = urllib.request.Request(base + "/api/ai/provider-keys",
                  data=json.dumps({"keys":{"gemini":"cosmic-ci-placeholder"}}).encode(),
                  headers={"Content-Type":"application/json"}, method="POST")
              with urllib.request.urlopen(save_req, timeout=10) as response:
                  saved = json.loads(response.read().decode())
              assert saved.get("success") is True, "Provider-key save route failed."
              clear_req = urllib.request.Request(base + "/api/ai/provider-keys",
                  data=json.dumps({"clear":["gemini"]}).encode(),
                  headers={"Content-Type":"application/json"}, method="POST")
              with urllib.request.urlopen(clear_req, timeout=10) as response:
                  cleared = json.loads(response.read().decode())
              assert cleared.get("success") is True, "Provider-key clear route failed."
              print("Frontend assets, backend routes and local provider-key settings passed.")
          finally:
              server.terminate()
              try: server.wait(timeout=10)
              except subprocess.TimeoutExpired: server.kill()
              log.close()
          PY

      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Copy latest COSMIC frontend
        run: |
          mkdir -p android-wrapper/www
          cp -a frontend/. android-wrapper/www/

      - name: Bundle Python backend source for Android
        run: |
          PYTHON_SRC="android-wrapper/android/app/src/main/python"
          mkdir -p "$PYTHON_SRC"
          rm -rf "$PYTHON_SRC/backend"
          cp -a backend "$PYTHON_SRC/backend"
          find "$PYTHON_SRC/backend" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$PYTHON_SRC/backend" -type f -name '*.pyc' -delete
          test -f "$PYTHON_SRC/backend/app.py"
          test -f "$PYTHON_SRC/backend/__init__.py"

      - name: Sync Capacitor Android project
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Restore permanent COSMIC signing keystore
        working-directory: android-wrapper/android
        env:
          COSMIC_KEYSTORE_BASE64: ${{ secrets.COSMIC_KEYSTORE_BASE64 }}
        run: |
          test -n "$COSMIC_KEYSTORE_BASE64" || { echo "Missing COSMIC_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p app
          printf '%s' "$COSMIC_KEYSTORE_BASE64" | base64 --decode > app/cosmic-release.p12
          test -s app/cosmic-release.p12
          chmod 600 app/cosmic-release.p12

      - name: Build signed COSMIC release APK
        working-directory: android-wrapper/android
        env:
          COSMIC_KEYSTORE_PATH: ${{ github.workspace }}/android-wrapper/android/app/cosmic-release.p12
          COSMIC_KEYSTORE_PASSWORD: ${{ secrets.COSMIC_KEYSTORE_PASSWORD }}
          COSMIC_KEY_ALIAS: ${{ secrets.COSMIC_KEY_ALIAS }}
          COSMIC_KEY_PASSWORD: ${{ secrets.COSMIC_KEY_PASSWORD }}
        run: |
          test -n "$COSMIC_KEYSTORE_PASSWORD" || { echo "Missing COSMIC_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$COSMIC_KEY_ALIAS" || { echo "Missing COSMIC_KEY_ALIAS repository secret"; exit 1; }
          test -n "$COSMIC_KEY_PASSWORD" || { echo "Missing COSMIC_KEY_PASSWORD repository secret"; exit 1; }
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare release APK and update metadata
        env:
          VERSION_CODE: '5'
          VERSION_NAME: '2.4.0'
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release
          cp android-wrapper/android/app/build/outputs/apk/release/app-release.apk release/COSMIC-2.4.0.apk
          APK_SHA256="$(sha256sum release/COSMIC-2.3.0.apk | awk '{print $1}')"
          export APK_SHA256
          python - <<'PY'
          import json, os
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          repository = os.environ["REPOSITORY"]
          tag = "v" + version_name
          data = {
              "app": "COSMIC",
              "package": "com.cosmic.ai",
              "versionCode": version_code,
              "versionName": version_name,
              "minSdk": 24,
              "apk": f"https://github.com/{repository}/releases/download/{tag}/COSMIC-{version_name}.apk",
              "sha256": os.environ["APK_SHA256"]
          }
          with open("release/latest.json", "w") as f:
              json.dump(data, f, indent=2)
          PY
        shell: bash

      - name: Upload signed APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-Android-Signed-APK
          path: |
            release/COSMIC-2.3.0.apk
            release/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: COSMIC 2.4.0
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/COSMIC-2.3.0.apk
            release/latest.json
