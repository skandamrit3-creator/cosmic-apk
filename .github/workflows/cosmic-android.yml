name: Build and Release COSMIC Android APK

on:
  push:
    branches:
      - feature/complete-cosmic-systems
      - feature/cosmic-unified-voice-assistant
      - feature/myraa-2d-reference-apk
    paths:
      - "android-wrapper/**"
      - "frontend/**"
      - "backend/**"
      - "hardware/**"
      - "docs/**"
      - ".github/workflows/cosmic-android.yml"
  pull_request:
    branches:
      - feature/complete-cosmic-systems
    paths:
      - "android-wrapper/**"
      - "frontend/**"
      - "backend/**"
      - "hardware/**"
      - "docs/**"
      - ".github/workflows/cosmic-android.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout COSMIC
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --check frontend/js/brain-control.js
          node --check frontend/js/integrations.js
          node --check frontend/js/gemini-live.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify referenced frontend assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          print(f"Verified {len(refs)} linked frontend assets.")
          PY

      - name: Install backend test dependencies
        run: pip install -r requirements.txt

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --check frontend/js/brain-control.js
          node --check frontend/js/integrations.js
          node --check frontend/js/gemini-live.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify shared frontend and backend routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, subprocess, sys, time, urllib.request
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          env = os.environ.copy()
          env.update({"COSMIC_HOST":"127.0.0.1","COSMIC_PORT":"8765","COSMIC_DATABASE":"data/cosmic-ci.db","PYTHONUNBUFFERED":"1"})
          log = open("cosmic-ci-backend.log", "w+")
          server = subprocess.Popen([sys.executable, "-m", "backend.app"], env=env, stdout=log, stderr=subprocess.STDOUT)
          try:
              base = "http://127.0.0.1:8765"
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(base + "/api/health", timeout=3) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      if server.poll() is not None:
                          log.flush()
                          log.seek(0)
                          print(log.read())
                          raise SystemExit("COSMIC backend exited before becoming healthy.")
                      time.sleep(1)
              else:
                  log.flush()
                  log.seek(0)
                  print(log.read())
                  raise SystemExit("COSMIC backend did not start.")
              for route in ["/", "/css/cosmic-foundation.css", "/js/avatar-studio.js", "/js/upgrade-ui.js", "/api/ai/models", "/api/ai/provider-keys", "/api/avatar/3d/status"]:
                  with urllib.request.urlopen(base + route, timeout=10) as response:
                      if response.status != 200:
                          raise SystemExit(route + " returned HTTP " + str(response.status))
              import json
              save_req = urllib.request.Request(base + "/api/ai/provider-keys",
                  data=json.dumps({"keys":{"gemini":"cosmic-ci-placeholder"}}).encode(),
                  headers={"Content-Type":"application/json"}, method="POST")
              with urllib.request.urlopen(save_req, timeout=10) as response:
                  saved = json.loads(response.read().decode())
              assert saved.get("success") is True, "Provider-key save route failed."
              clear_req = urllib.request.Request(base + "/api/ai/provider-keys",
                  data=json.dumps({"clear":["gemini"]}).encode(),
                  headers={"Content-Type":"application/json"}, method="POST")
              with urllib.request.urlopen(clear_req, timeout=10) as response:
                  cleared = json.loads(response.read().decode())
              assert cleared.get("success") is True, "Provider-key clear route failed."
              print("Frontend assets, backend routes and local provider-key settings passed.")
          finally:
              server.terminate()
              try: server.wait(timeout=10)
              except subprocess.TimeoutExpired: server.kill()
              log.close()
          PY

      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Copy latest COSMIC frontend
        run: |
          mkdir -p android-wrapper/www
          cp -a frontend/. android-wrapper/www/

      - name: Bundle Python backend source for Android
        run: |
          PYTHON_SRC="android-wrapper/android/app/src/main/python"
          mkdir -p "$PYTHON_SRC"
          rm -rf "$PYTHON_SRC/backend"
          cp -a backend "$PYTHON_SRC/backend"
          find "$PYTHON_SRC/backend" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$PYTHON_SRC/backend" -type f -name '*.pyc' -delete
          test -f "$PYTHON_SRC/backend/app.py"
          test -f "$PYTHON_SRC/backend/__init__.py"

      - name: Sync Capacitor Android project
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Restore permanent COSMIC signing keystore
        if: github.ref == 'refs/heads/feature/complete-cosmic-systems' || github.ref == 'refs/heads/feature/myraa-2d-reference-apk'
        working-directory: android-wrapper/android
        env:
          COSMIC_KEYSTORE_BASE64: ${{ secrets.COSMIC_KEYSTORE_BASE64 }}
        run: |
          test -n "$COSMIC_KEYSTORE_BASE64" || { echo "Missing COSMIC_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p app
          printf '%s' "$COSMIC_KEYSTORE_BASE64" | base64 --decode > app/cosmic-release.p12
          test -s app/cosmic-release.p12
          chmod 600 app/cosmic-release.p12

      - name: Build Android APK
        working-directory: android-wrapper/android
        env:
          COSMIC_KEYSTORE_PATH: ${{ github.workspace }}/android-wrapper/android/app/cosmic-release.p12
          COSMIC_KEYSTORE_PASSWORD: ${{ secrets.COSMIC_KEYSTORE_PASSWORD }}
          COSMIC_KEY_ALIAS: ${{ secrets.COSMIC_KEY_ALIAS }}
          COSMIC_KEY_PASSWORD: ${{ secrets.COSMIC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$GITHUB_REF" = "refs/heads/feature/complete-cosmic-systems" ] || [ "$GITHUB_REF" = "refs/heads/feature/myraa-2d-reference-apk" ]; then
            test -s "$COSMIC_KEYSTORE_PATH" || { echo "Missing permanent COSMIC signing keystore"; exit 1; }
            test -n "$COSMIC_KEYSTORE_PASSWORD" || { echo "Missing COSMIC_KEYSTORE_PASSWORD repository secret"; exit 1; }
            test -n "$COSMIC_KEY_ALIAS" || { echo "Missing COSMIC_KEY_ALIAS repository secret"; exit 1; }
            test -n "$COSMIC_KEY_PASSWORD" || { echo "Missing COSMIC_KEY_PASSWORD repository secret"; exit 1; }
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Prepare release APK and update metadata
        env:
          VERSION_CODE: '17'
          VERSION_NAME: '2.9.7'
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v2.9.7
        run: |
          mkdir -p release
          if [ "$GITHUB_REF" != "refs/heads/feature/complete-cosmic-systems" ] && [ "$GITHUB_REF" != "refs/heads/feature/myraa-2d-reference-apk" ]; then
            cp android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk release/COSMIC-2.9.7-debug.apk
          else
            cp android-wrapper/android/app/build/outputs/apk/release/app-release.apk release/COSMIC-2.9.7.apk
            APK_SHA256="$(sha256sum release/COSMIC-2.9.7.apk | awk '{print $1}')"
            export APK_SHA256
            python -c 'import json, os; version=os.environ["VERSION_NAME"]; data={"app":"COSMIC","package":"com.cosmic.ai","versionCode":int(os.environ["VERSION_CODE"]),"versionName":version,"minSdk":24,"apk":"https://github.com/"+os.environ["REPOSITORY"]+"/releases/download/"+os.environ["RELEASE_TAG"]+"/COSMIC-"+version+".apk","sha256":os.environ["APK_SHA256"]}; open("release/latest.json","w").write(json.dumps(data,indent=2))'
          fi
        shell: bash

      - name: Upload Android build artifact
        if: github.ref != 'refs/heads/feature/myraa-2d-reference-apk'
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-Android-APK
          path: |
            release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/complete-cosmic-systems' || github.ref == 'refs/heads/feature/myraa-2d-reference-apk')
        uses: softprops/action-gh-release@v2
        with:
          name: COSMIC 2.9.7
          tag_name: v2.9.7
          target_commitish: feature/myraa-2d-reference-apk
          generate_release_notes: true
          files: |
            release/COSMIC-2.9.7.apk
            release/latest.json

      - name: Remove previous COSMIC 2.9.5 release after new APK publication
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/myraa-2d-reference-apk'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              const previous = await github.rest.repos.getReleaseByTag({ owner, repo, tag: "v2.9.6" });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: previous.data.id });
              core.info("Deleted superseded COSMIC 2.9.6 release after COSMIC 2.9.7 was published.");
            } catch (error) {
              if (error.status === 404) core.info("No previous v2.9.6 release found; nothing to remove.");
              else throw error;
            }
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: "tags/v2.9.6" });
              core.info("Deleted superseded v2.9.6 tag.");
            } catch (error) {
              if (error.status === 404) core.info("No v2.9.6 tag found.");
              else throw error;
            }
