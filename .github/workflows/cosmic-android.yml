name: Build COSMIC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout COSMIC
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Validate Python backend
        run: python -m compileall -q backend

      - name: Validate frontend JavaScript
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/cosmic-modes.js
          node --check frontend/js/voice-control.js
          node --input-type=module --check < frontend/js/avatar-studio.js

      - name: Verify referenced frontend assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text()
          refs = re.findall(r'(?:src|href)="(js/[^"]+|css/[^"]+)"', html)
          missing = [ref for ref in refs if not (Path("frontend") / ref).is_file()]
          if missing:
              raise SystemExit("Missing frontend assets: " + ", ".join(missing))
          print(f"Verified {len(refs)} linked frontend assets.")
          PY

      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Copy latest COSMIC frontend
        run: |
          mkdir -p android-wrapper/www
          cp -a frontend/. android-wrapper/www/

      - name: Sync Capacitor Android project
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Build COSMIC APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload COSMIC APK
        uses: actions/upload-artifact@v4
        with:
          name: COSMIC-Android-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
